<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Viewport & Theme ──────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4fa" media="(prefers-color-scheme: light)" />

    <!-- ── SEO Core ─────────────────────────────────────────────────── -->
    <title>OpenAidy — Open Source AI Agent Platform</title>
    <meta name="description" content="OpenAidy is an open source AI agent platform that is self-hosted, extensible, and built for developers. Install in minutes, own everything forever." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="OpenAidy" />
    <meta name="keywords" content="AI agent, open source, self-hosted, LLM, developer tools, automation, plugins, extensible AI" />
    <link rel="canonical" href="https://openaidy.com/" />

    <!-- ── Open Graph (Facebook / LinkedIn / Slack) ────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://openaidy.com/" />
    <meta property="og:site_name" content="OpenAidy" />
    <meta property="og:title" content="OpenAidy — Open Source AI Agent Platform" />
    <meta property="og:description" content="OpenAidy is an open source AI agent platform that is self-hosted, extensible, and built for developers. Install in minutes, own everything forever." />
    <meta property="og:image" content="https://openaidy.com/og-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenAidy — Open Source AI Agent Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Cards ────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@openaidy" />
    <meta name="twitter:creator" content="@openaidy" />
    <meta name="twitter:url" content="https://openaidy.com/" />
    <meta name="twitter:title" content="OpenAidy — Open Source AI Agent Platform" />
    <meta name="twitter:description" content="OpenAidy is an open source AI agent platform that is self-hosted, extensible, and built for developers." />
    <meta name="twitter:image" content="https://openaidy.com/og-home.png" />
    <meta name="twitter:image:alt" content="OpenAidy — Open Source AI Agent Platform" />

    <!-- ── Structured Data (JSON-LD) ───────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenAidy",
      "url": "https://openaidy.com",
      "description": "Open source AI agent platform. Self-hosted, extensible, built for developers.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Linux, macOS, Windows",
      "license": "https://github.com/imzodev/openaidy/blob/main/LICENSE",
      "codeRepository": "https://github.com/imzodev/openaidy",
      "keywords": "AI agent, open source, self-hosted, LLM, developer tools",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free and open source"
      }
    }
    </script>

    <!-- ── Fonts ───────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
