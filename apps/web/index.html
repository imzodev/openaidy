<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAidy</title>
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#111827';
        } else {
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      })();
    </script>
    <script>
      // Recover from a stale build after a server update/restart (self-update,
      // manual `openaidy start`, or an SSH-triggered reinstall). Asset
      // filenames are content-hashed per build; a restart replaces the whole
      // assets/ directory, so a tab that already has an older index.html
      // cached (HTTP cache, back/forward-cache restore, or just being open
      // across the restart) can request an asset that no longer exists. The
      // SPA route falls back to 200 + this same index.html for any unmatched
      // path, so the browser gets HTML back where it expected JS/CSS, and the
      // module script below fails strict MIME-type checking — silently
      // blanking the page with no visible error but a console one.
      //
      // This has to be a plain, non-module script registered BEFORE the
      // module script tag: if that tag itself is what fails, nothing inside
      // it (including any handler defined there) ever runs to catch it. See
      // src/lib/stale-build-recovery.ts for the complementary case — a
      // dynamically-imported route chunk going stale mid-session, once the
      // app is already running.
      (function () {
        var GUARD_KEY = 'openaidy_stale_build_reload';
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!target) return;
            var src = target.src || target.href;
            if (typeof src !== 'string' || src.indexOf('/assets/') === -1) return;
            if (sessionStorage.getItem(GUARD_KEY)) {
              console.error(
                '[stale-build] failed to load ' + src + ' — already reloaded once this session, not retrying',
              );
              return;
            }
            sessionStorage.setItem(GUARD_KEY, '1');
            console.warn('[stale-build] failed to load ' + src + ' — reloading to pick up the current build');
            window.location.reload();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
