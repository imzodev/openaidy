[package]
name = "openaidy-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "openaidy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["process", "io-util", "sync", "net", "macros", "rt-multi-thread"] }
portpicker = "0.1"
dirs = "5"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
futures = "0.3.32"
