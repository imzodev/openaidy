name: Release

# Cut a release by pushing a semver tag:
#   git tag v0.2.0 && git push origin v0.2.0
# Gates on the same checks as CI, publishes the prebuilt `openaidy` package to
# npm, then publishes a GitHub Release. The installer runs `npm i -g openaidy`,
# so a green publish here is what users install.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  gate:
    name: Gate (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm -r lint
      - name: Build (includes typecheck)
        run: pnpm -r build
      - name: Test
        run: pnpm -r test

  publish-npm:
    name: Publish @openaidy/app to npm
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing: npm exchanges this short-lived GitHub identity
      # for publish rights (no long-lived NPM_TOKEN). Requires a Trusted
      # Publisher configured on the package pointing at this repo + workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 24 ships a modern npm (>= 11.5.1, with sigstore) that supports OIDC
      # trusted publishing + provenance. We do NOT `npm install -g npm@latest`:
      # upgrading npm in-place corrupts its bundled deps, which is what caused
      # provenance to fail with "Cannot find module 'sigstore'".
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm --filter web build
      - name: Build npm package
        run: pnpm build:npm
      - name: Publish (skip if this version is already on npm)
        working-directory: build/npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published — skipping."
          else
            npm publish
          fi

  build-desktop:
    # "unsigned" refers to OS code signing only (still no Windows/Apple cert
    # — SmartScreen/Gatekeeper still warn on first launch, see
    # docs/desktop/DEPENDENCIES.md). The updater's own signing (a separate,
    # unrelated keypair — TAURI_SIGNING_PRIVATE_KEY below) IS applied.
    name: Build desktop app (${{ matrix.artifact-name }}, OS-unsigned)
    needs: gate
    strategy:
      # One platform failing (e.g. a transient macOS runner issue) shouldn't
      # cancel the others — each produces an independent set of installers.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows
          - platform: macos-latest
            artifact-name: macos
          - platform: ubuntu-latest
            artifact-name: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # Tauri's own Linux build prerequisites — see docs/desktop/DEPENDENCIES.md.
      # No libfuse2/AppImage-specific deps: bundle.targets in tauri.conf.json
      # deliberately excludes appimage (see that file's own note) — deb/rpm
      # don't need linuxdeploy or FUSE at all.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # macOS ships a single universal binary (Intel + Apple Silicon) rather
      # than picking whichever arch the runner happens to be — macos-latest
      # runners are arm64, so without this an Intel Mac user would get an
      # installer that can't even launch. Empty `targets` on the other
      # platforms is a no-op; the host's default target is always installed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # apps/desktop/src-tauri/tauri.conf.json's "version" ships baked into
      # the installer and is what the updater compares against latest.json
      # to decide an update exists — it must move every release, or every
      # build looks identical to the last and no one is ever offered an
      # update. Patched here rather than committed, so the repo's own
      # checked-in tauri.conf.json doesn't need a bump commit per release.
      - name: Set desktop app version to match release tag
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const path = 'apps/desktop/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "
      # tauri.conf.json's beforeBuildCommand (pnpm --filter web build) runs
      # automatically as part of this — no separate web-build step needed.
      # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) sign the updater-capable
      # artifacts (see createUpdaterArtifacts in tauri.conf.json) with a
      # keypair unrelated to OS code signing — this is what lets the
      # updater plugin verify a downloaded update actually came from this
      # repo's CI rather than e.g. a compromised release asset.
      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `pnpm --filter X tauri:build -- --target ...` silently mangles the
        # forwarded args (pnpm inserts a literal extra "--", so tauri sees
        # `build -- --target ...` and ignores the real flag) — confirmed
        # locally. `pnpm exec` calls the binary directly, no run-script arg
        # forwarding involved, so the args actually arrive as typed.
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            pnpm --filter @openaidy/desktop exec tauri build --target universal-apple-darwin
          else
            pnpm --filter @openaidy/desktop exec tauri build
          fi
      # OS-unsigned build: Windows will show a SmartScreen warning, macOS will
      # refuse to open the app until the user right-click's > Open (Gatekeeper
      # blocks unsigned/un-notarized apps by default). Tracked as follow-up
      # work once real signing certs are in place — see docs/desktop/DEPENDENCIES.md.
      # if: always() — one bundle format failing shouldn't discard
      # installers other formats already produced first in the same
      # `tauri build` invocation; upload-artifact itself already
      # tolerates individual missing globs via if-no-files-found below.
      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.artifact-name }}
          # Only the paths that exist on a given OS actually match; the rest
          # are silently skipped (if-no-files-found: ignore below) rather than
          # failing the upload — each OS only produces a subset of these.
          # A universal-target macOS build bundles under
          # target/universal-apple-darwin/... instead of the default
          # target/release/... other platforms use.
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: ignore
          retention-days: 90
      # A separate artifact (not mixed into desktop-installer-* above) so
      # attach-desktop-installers can tell "user-facing installer" and
      # "updater manifest fragment" apart without needing to filter by
      # filename pattern.
      - name: Generate update manifest fragment
        if: always()
        shell: bash
        run: |
          node scripts/desktop-update-manifest.mjs fragment \
            "${{ matrix.artifact-name }}" \
            "update-fragment-${{ matrix.artifact-name }}.json" \
            "${{ steps.tag.outputs.tag }}"
      - name: Upload update manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-fragment-${{ matrix.artifact-name }}
          path: update-fragment-${{ matrix.artifact-name }}.json
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [gate, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so release-note generation can diff against the
          # previous tag.
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  attach-desktop-installers:
    name: Attach desktop installers to release
    needs: [release, build-desktop]
    # Still attach whatever installers did build even if one platform in the
    # matrix failed (unsigned desktop builds are best-effort for now — a
    # single flaky runner shouldn't block the CLI release this gates).
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-installer-*
          path: dist-desktop
          merge-multiple: true
      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -z "$(ls -A dist-desktop 2>/dev/null)" ]; then
            echo "No desktop installers were produced — nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" dist-desktop/* --repo "${{ github.repository }}" --clobber
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-update-fragment-*
          path: dist-update-fragments
          merge-multiple: true
      - name: Publish update manifest (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          node scripts/desktop-update-manifest.mjs merge \
            "$VERSION" "$NOTES" latest.json \
            dist-update-fragments/*.json
          gh release upload "$TAG" latest.json --repo "${{ github.repository }}" --clobber
